# Upstream configuration pointing to the Puma socket or port
upstream rails_app {
  # If Puma is configured to run on a Unix socket (recommended for VPS):
  server unix:/home/deploy/apps/chetu_blog/shared/tmp/sockets/puma.sock fail_timeout=0;
  
  # Or if Puma is running on a TCP port:
  # server 127.0.0.1:3000;
}

# 1. REDIRECT: Catch HTTP (80) non-www and www, redirect to HTTPS www
server {
  listen 80;
  listen [::]:80;
  server_name chetu_blog.com www.chetu_blog.com;
  
  return 301 https://www.chetu_blog.com$request_uri;
}

# 2. REDIRECT: Catch HTTPS (443) non-www and redirect to HTTPS www
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name chetu_blog.com;

  # SSL Certificates (Change these to your actual paths, e.g., Let's Encrypt)
  ssl_certificate /etc/letsencrypt/live/chetu_blog.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/chetu_blog.com/privkey.pem;

  return 301 https://www.chetu_blog.com$request_uri;
}

# 3. MAIN BLOCK: Serve HTTPS www.chetu_blog.com
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.chetu_blog.com;

  # Path to your Rails public folder (important for serving static assets)
  root /home/deploy/apps/chetu_blog/current/public;

  # SSL Certificates
  ssl_certificate /etc/letsencrypt/live/chetu_blog.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/chetu_blog.com/privkey.pem;

  # Log locations
  access_log /var/log/nginx/chetu_blog.access.log;
  error_log /var/log/nginx/chetu_blog.error.log info;

  # Try to serve static files directly, otherwise pass to Puma
  try_files $uri/index.html $uri @rails;

  location @rails {
    proxy_pass http://rails_app;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Host $http_host;
    proxy_redirect off;
  }

  # Serve static assets with cache headers
  location ~ ^/(assets|packs|packs-test)/ {
    gzip_static on;
    expires max;
    add_header Cache-Control public;
  }

  # Error pages
  error_page 500 502 503 504 /500.html;
  client_max_body_size 4G;
  keepalive_timeout 10;
}
